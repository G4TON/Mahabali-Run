<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" shape-rendering="crispEdges">
  <!-- App Icon Background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0d1b2a" />
  
  <!-- Outer Gold Border -->
  <path d="M 14 2 H 50 V 4 H 58 V 6 H 60 V 14 H 62 V 50 H 60 V 58 H 58 V 60 H 50 V 62 H 14 V 60 H 6 V 58 H 4 V 50 H 2 V 14 H 4 V 6 H 6 V 4 H 14 Z" fill="#ffd700" opacity="0.3" />
  
  <!-- Radial Aura Effect -->
  <rect x="16" y="16" width="32" height="32" fill="#f39c12" opacity="0.25" />
  <rect x="20" y="20" width="24" height="24" fill="#f1c40f" opacity="0.3" />
  
  <!-- Crown (Kireetam) - Outer/Base -->
  <rect x="22" y="14" width="20" height="2" fill="#b37700" />
  <rect x="20" y="12" width="24" height="2" fill="#ffd700" />
  <rect x="22" y="10" width="20" height="2" fill="#ffae00" />
  <rect x="24" y="8" width="16" height="2" fill="#ffd700" />
  <rect x="26" y="6" width="12" height="2" fill="#ffae00" />
  <rect x="28" y="4" width="8" height="2" fill="#ffd700" />
  <rect x="30" y="2" width="4" height="2" fill="#ffffff" />
  
  <!-- Crown Jewels -->
  <rect x="31" y="9" width="2" height="3" fill="#e74c3c" />
  <rect x="25" y="11" width="2" height="2" fill="#2ecc71" />
  <rect x="37" y="11" width="2" height="2" fill="#2ecc71" />

  <!-- Face Structure -->
  <rect x="22" y="16" width="20" height="12" fill="#d35400" />
  <rect x="20" y="18" width="24" height="8" fill="#e67e22" />
  <rect x="24" y="28" width="16" height="4" fill="#d35400" />
  <rect x="26" y="32" width="12" height="2" fill="#ba4a00" />

  <!-- Eyes -->
  <!-- Left Eye -->
  <rect x="23" y="20" width="6" height="2" fill="#ffffff" />
  <rect x="25" y="20" width="2" height="2" fill="#2c3e50" />
  <rect x="23" y="19" width="6" height="1" fill="#4a235a" /> <!-- Eyebrow -->
  
  <!-- Right Eye -->
  <rect x="35" y="20" width="6" height="2" fill="#ffffff" />
  <rect x="37" y="20" width="2" height="2" fill="#2c3e50" />
  <rect x="35" y="19" width="6" height="1" fill="#4a235a" /> <!-- Eyebrow -->

  <!-- Sacred Tilak / Chandanam ( forehead ) -->
  <rect x="28" y="16" width="8" height="1" fill="#ffffff" />
  <rect x="29" y="17" width="6" height="1" fill="#ffffff" />
  <rect x="31" y="17" width="2" height="2" fill="#e74c3c" />

  <!-- Grand Royal Mustache -->
  <rect x="22" y="24" width="20" height="2" fill="#1a252f" />
  <rect x="18" y="25" width="28" height="3" fill="#2c3e50" />
  <rect x="16" y="24" width="3" height="3" fill="#2c3e50" /> <!-- Left Curl -->
  <rect x="15" y="23" width="2" height="2" fill="#2c3e50" />
  <rect x="45" y="24" width="3" height="3" fill="#2c3e50" /> <!-- Right Curl -->
  <rect x="47" y="23" width="2" height="2" fill="#2c3e50" />

  <!-- Smile / Lip -->
  <rect x="29" y="28" width="6" height="1" fill="#c0392b" />

  <!-- Earrings (Kundalangal) -->
  <rect x="17" y="20" width="3" height="5" fill="#f1c40f" />
  <rect x="18" y="22" width="1" height="1" fill="#e74c3c" />
  <rect x="44" y="20" width="3" height="5" fill="#f1c40f" />
  <rect x="45" y="22" width="1" height="1" fill="#e74c3c" />

  <!-- Neck & Royal Torso -->
  <rect x="22" y="34" width="20" height="18" fill="#e67e22" />
  
  <!-- Heavy Gold Necklaces -->
  <rect x="24" y="34" width="16" height="3" fill="#f1c40f" />
  <rect x="22" y="37" width="20" height="3" fill="#ffd700" />
  <rect x="20" y="40" width="24" height="3" fill="#f1c40f" />
  <rect x="30" y="43" width="4" height="4" fill="#e74c3c" /> <!-- Ruby Pendant -->
  <rect x="29" y="42" width="6" height="6" fill="#ffd700" opacity="0.5" />

  <!-- Traditional Garland (Pookkalam motif) -->
  <rect x="16" y="34" width="6" height="20" fill="#2ecc71" />
  <rect x="42" y="34" width="6" height="20" fill="#2ecc71" />
  <rect x="17" y="36" width="4" height="4" fill="#ffffff" />
  <rect x="43" y="36" width="4" height="4" fill="#ffffff" />
  <rect x="17" y="42" width="4" height="4" fill="#e67e22" />
  <rect x="43" y="42" width="4" height="4" fill="#e67e22" />
  <rect x="17" y="48" width="4" height="4" fill="#f1c40f" />
  <rect x="43" y="48" width="4" height="4" fill="#f1c40f" />

  <!-- Palm Leaf Umbrella (Olayakuda) - Held on Right side -->
  <!-- Handle -->
  <rect x="10" y="26" width="2" height="36" fill="#7e5109" />
  <rect x="11" y="26" width="1" height="36" fill="#a0522d" />
  <!-- Shield/Umbrella Canopy -->
  <path d="M 2 24 L 11 10 L 20 24 Z" fill="#d4ac0d" />
  <rect x="2" y="24" width="18" height="2" fill="#b7950b" />
  <rect x="5" y="15" width="12" height="2" fill="#f4d03f" />
  <rect x="8" y="20" width="6" height="4" fill="#7d6608" />

  <!-- Dynamic Game UI Elements / Gloss Overlay -->
  <!-- Highlight Curve for App Icon feel -->
  <path d="M 0 14 C 0 6, 6 0, 14 0 L 50 0 C 58 0, 64 6, 64 14 L 64 24 L 0 38 Z" fill="#ffffff" opacity="0.08" />
</svg>
